name: ci

# The fork's own gate. go.yml (inherited from upstream) is the interop run
# against a real Samba and a real Windows share; this one is the unit gate:
# race-detected tests on three operating systems, gofmt, vet, govulncheck and
# a short fuzz of every target.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.27.4'
          cache: true
      - run: go vet ./...
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"; echo "$unformatted"
            exit 1
          fi
      - run: go test -race -count=1 ./...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.27.4'
          cache: true
      - run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  # Short, time-boxed. fuzzrun exits 1 for a crasher or for Go's benign
  # "context deadline exceeded" flake, and 2 when the run could not be made;
  # only 2 is red here. The seed corpus runs, blocking, in the test job.
  fuzz:
    name: fuzz (short)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.27.4'
          cache: true
      - name: fuzz every target (found by parsing, not listed)
        run: |
          set +e
          go run github.com/go-fleettools/fuzzrun@v0.5.0 run --time 30s --jobs 2 --parallel 2 --logs fuzz-logs
          status=$?
          if [ "$status" -ge 2 ]; then
            echo "::error::fuzzrun could not run (exit $status)"
            exit "$status"
          fi
